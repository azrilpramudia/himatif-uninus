openapi: 3.0.3
info:
  title: Himatif Uninus API
  description: REST API for the HIMATIF UNINUS website
  version: 1.0.0
  contact:
    name: Himatif Uninus
    email: himatif@uninus.ac.id

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: Administrator authentication
  - name: Events
    description: Public event reads
  - name: Galleries
    description: Public gallery reads
  - name: Admin Events
    description: Protected event management
  - name: Admin Galleries
    description: Protected gallery management
  - name: Upload
    description: Protected image upload

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Authentication
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          minLength: 6
          example: change-me

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Admin Himatif
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          minLength: 6
          example: change-me

    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: login successful
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    # Events
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d0085599-401d-4a21-aafa-160f0181c484
        title:
          type: string
          example: Informatika Coding Camp 2024
        slug:
          type: string
          example: informatika-coding-camp-2024-abc12345
        description:
          type: string
          example: Intensive coding training program
        content:
          type: string
          example: Full details for the ICC 2024 event
        thumbnail:
          type: string
          description: Path returned by the upload endpoint.
          example: /uploads/gallery/1234567890_abc12345.jpg
        location:
          type: string
          example: UNINUS Hall, Bandung
        status:
          type: string
          enum: [upcoming, ongoing, completed]
          example: upcoming
        start_date:
          type: string
          format: date-time
          example: "2024-10-01T08:00:00Z"
        end_date:
          type: string
          format: date-time
          example: "2024-10-03T17:00:00Z"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEventInput:
      type: object
      required: [title, start_date, end_date]
      properties:
        title:
          type: string
          example: Informatika Coding Camp 2024
        description:
          type: string
          example: Intensive coding training program
        content:
          type: string
          example: Full details for the ICC 2024 event
        thumbnail:
          type: string
          description: Path returned by the upload endpoint.
          example: /uploads/gallery/1234567890_abc12345.jpg
        location:
          type: string
          example: UNINUS Hall, Bandung
        status:
          type: string
          enum: [upcoming, ongoing, completed]
          example: upcoming
        start_date:
          type: string
          format: date-time
          example: "2024-10-01T08:00:00Z"
        end_date:
          type: string
          format: date-time
          example: "2024-10-03T17:00:00Z"

    UpdateEventInput:
      type: object
      properties:
        title:
          type: string
          example: ICC 2024 Updated
        description:
          type: string
        content:
          type: string
        thumbnail:
          type: string
        location:
          type: string
          example: Gedung B UNINUS
        status:
          type: string
          enum: [upcoming, ongoing, completed]
          example: ongoing
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time

    # Gallery
    Gallery:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d0085599-401d-4a21-aafa-160f0181c484
        title:
          type: string
          example: ICC 2024 event photo
        image_url:
          type: string
          example: /uploads/gallery/1234567890_abc12345.jpg
        category:
          type: string
          enum: [kegiatan, prestasi, organisasi, lainnya]
          example: kegiatan
        event_id:
          type: string
          format: uuid
          example: d0085599-401d-4a21-aafa-160f0181c484
        event:
          $ref: "#/components/schemas/Event"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateGalleryInput:
      type: object
      required: [title, image_url]
      properties:
        title:
          type: string
          example: ICC 2024 event photo
        image_url:
          type: string
          example: /uploads/gallery/1234567890_abc12345.jpg
        category:
          type: string
          enum: [kegiatan, prestasi, organisasi, lainnya]
          example: kegiatan
        event_id:
          type: string
          format: uuid
          example: d0085599-401d-4a21-aafa-160f0181c484

    UpdateGalleryInput:
      type: object
      properties:
        title:
          type: string
          example: Updated ICC 2024 event photo
        image_url:
          type: string
        category:
          type: string
          enum: [kegiatan, prestasi, organisasi, lainnya]
        event_id:
          type: string
          format: uuid

    # Common responses
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: success
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: error message

paths:
  # Health
  /health:
    get:
      summary: Health check
      description: Check whether the API server is running.
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Backend is running

  # Authentication
  /api/v1/admin/users:
    post:
      tags: [Auth]
      summary: Create another admin
      description: Create an administrator account. Requires a valid administrator JWT.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: register successful
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
        "400":
          description: Input validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to create administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Administrator login
      description: Authenticate an administrator and receive a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Request body is invalid or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Public events
  /api/v1/events:
    get:
      tags: [Events]
      summary: List events
      description: Return all events. No authentication is required.
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"

  /api/v1/events/{slug}:
    get:
      tags: [Events]
      summary: Get event by slug
      description: Return an event identified by its slug. No authentication is required.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: informatika-coding-camp-2024-abc12345
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Public galleries
  /api/v1/galleries:
    get:
      tags: [Galleries]
      summary: List gallery items
      description: Return all gallery items. Optionally filter by category.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [kegiatan, prestasi, organisasi, lainnya]
          example: kegiatan
      responses:
        "200":
          description: Gallery item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Gallery"
        "400":
          description: The category is not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/galleries/{id}:
    get:
      tags: [Galleries]
      summary: Get gallery item by ID
      description: Return a gallery item by UUID. No authentication is required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gallery item details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Gallery"
        "404":
          description: Gallery item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Admin events
  /api/v1/admin/events:
    get:
      tags: [Admin Events]
      summary: List events (admin)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Admin Events]
      summary: Create event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: event created successfully
                  data:
                    $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/events/{id}:
    get:
      tags: [Admin Events]
      summary: Get event by ID (admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Admin Events]
      summary: Update event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventInput"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: event updated successfully
                  data:
                    $ref: "#/components/schemas/Event"
        "400":
          description: Invalid input or event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Admin Events]
      summary: Delete event
      description: Delete an event and its related gallery records.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: event deleted successfully
        "400":
          description: Delete failed, including when the event does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Admin galleries
  /api/v1/admin/galleries:
    get:
      tags: [Admin Galleries]
      summary: List gallery items (admin)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Gallery item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Gallery"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Admin Galleries]
      summary: Create gallery item
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGalleryInput"
      responses:
        "201":
          description: Gallery item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: gallery created successfully
                  data:
                    $ref: "#/components/schemas/Gallery"
        "400":
          description: Invalid gallery input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/galleries/{id}:
    get:
      tags: [Admin Galleries]
      summary: Get gallery item by ID (admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gallery item details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Gallery"
        "404":
          description: Gallery item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Admin Galleries]
      summary: Update gallery item
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGalleryInput"
      responses:
        "200":
          description: Gallery item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: gallery updated successfully
                  data:
                    $ref: "#/components/schemas/Gallery"
        "400":
          description: Invalid input or gallery item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Admin Galleries]
      summary: Delete gallery item
      description: Delete the gallery record. The uploaded image file is not deleted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gallery item deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: gallery deleted successfully
        "400":
          description: Delete failed, including when the gallery item does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Image upload
  /api/v1/admin/upload:
    post:
      tags: [Upload]
      summary: Upload an image
      description: Upload an image to the gallery upload directory and return its public path.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPG, JPEG, PNG, or WEBP image. Maximum size is 5 MiB.
      responses:
        "200":
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: image uploaded successfully
                  image_url:
                    type: string
                    example: /uploads/gallery/1234567890_abc12345.jpg
        "400":
          description: Missing file, unsupported extension, or file exceeds 5 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not have the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
